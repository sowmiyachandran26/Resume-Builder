<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <title>ResumeForge – Build Your Story</title>
    <style>
        :root {
            --ink: #1a1a2e;
            --cream: #f8f5f0;
            --gold: #c9a84c;
            --gold-light: #e8d5a3;
            --muted: #6b6b7b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Background texture */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 20% 20%, rgba(201,168,76,0.08) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(26,26,46,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .hero {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 20px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: var(--gold-light);
            color: var(--ink);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 32px;
            animation: fadeUp 0.6s ease both;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 8vw, 88px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1px;
            max-width: 800px;
            animation: fadeUp 0.6s 0.1s ease both;
        }
        h1 em {
            font-style: italic;
            color: var(--gold);
        }
        .subtitle {
            margin-top: 24px;
            font-size: 18px;
            color: var(--muted);
            font-weight: 300;
            max-width: 460px;
            line-height: 1.7;
            animation: fadeUp 0.6s 0.2s ease both;
        }
        .cta-group {
            margin-top: 48px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeUp 0.6s 0.3s ease both;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--ink);
            color: var(--cream);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 16px 36px;
            border-radius: 4px;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            background: var(--gold);
            color: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201,168,76,0.3);
        }
        .btn-primary .arrow {
            transition: transform 0.25s ease;
        }
        .btn-primary:hover .arrow { transform: translateX(4px); }
        /* Features row */
        .features {
            margin-top: 80px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeUp 0.6s 0.4s ease both;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 400;
        }
        .feature-dot {
            width: 6px; height: 6px;
            background: var(--gold);
            border-radius: 50%;
            flex-shrink: 0;
        }
        /* Decorative line */
        .deco-line {
            position: fixed;
            top: 0; left: 50%;
            width: 1px;
            height: 100vh;
            background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.2), transparent);
            pointer-events: none;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="deco-line"></div>
    <section class="hero">
        <span class="badge">✦ Professional Resume Builder</span>
        <h1>Craft Your <em>Story</em>,<br>Land the Role.</h1>
        <p class="subtitle">Three elegant templates. One clean form. A polished resume ready in minutes.</p>
        <div class="cta-group">
            <a class="btn-primary" href="/form">
                Build My Resume <span class="arrow">→</span>
            </a>
        </div>
        <div class="features">
            <div class="feature"><span class="feature-dot"></span> 3 Professional Templates</div>
            <div class="feature"><span class="feature-dot"></span> Instant PDF Download</div>
            <div class="feature"><span class="feature-dot"></span> No Sign-up Required</div>
        </div>
    </section>
</body>
</html>
